# ── zh ──────────────────────────────────────────────────────────
[[prompt]]
id = "zh-01"
kind = "zh"
text = "請用繁體中文說明冰箱是怎麼讓食物保持低溫的，寫幾段給一般讀者看。"

[[prompt]]
id = "zh-02"
kind = "zh"
text = "請用繁體中文解釋，為什麼白天的天空是藍色的，日落時卻變成紅色。"

[[prompt]]
id = "zh-03"
kind = "zh"
text = "請用繁體中文說明颱風是怎麼形成的，以及為什麼臺灣夏秋兩季特別容易遇到颱風。"

[[prompt]]
id = "zh-04"
kind = "zh"
text = "請用繁體中文解釋什麼是通貨膨脹，以及它對一般家庭的生活有什麼影響。"

[[prompt]]
id = "zh-05"
kind = "zh"
text = "請用繁體中文說明地震是怎麼發生的，以及臺灣為什麼地震特別多。"

[[prompt]]
id = "zh-06"
kind = "zh"
text = "請用繁體中文介紹珍珠奶茶的由來，以及它是怎麼做出來的。"

[[prompt]]
id = "zh-07"
kind = "zh"
text = "請用繁體中文解釋疫苗是怎麼讓人體產生免疫力的。"

[[prompt]]
id = "zh-08"
kind = "zh"
text = "請用繁體中文說明全民健康保險的基本運作方式：錢從哪裡來、看病時怎麼用。"

[[prompt]]
id = "zh-09"
kind = "zh"
text = "請用繁體中文解釋為什麼一年有四季，以及南北半球的季節為什麼相反。"

[[prompt]]
id = "zh-10"
kind = "zh"
text = "請用繁體中文說明高鐵為什麼能跑得比一般火車快，從軌道、車輛與路線三方面來談。"

[[prompt]]
id = "zh-11"
kind = "zh"
text = "請用繁體中文介紹臺灣的夜市文化，包括常見的小吃與它在日常生活中的角色。"

[[prompt]]
id = "zh-12"
kind = "zh"
text = "請用繁體中文解釋複利是什麼，以及為什麼越早開始存錢差別越大。"

[[prompt]]
id = "zh-13"
kind = "zh"
text = "請用繁體中文說明手機是怎麼透過基地台打電話與上網的。"

[[prompt]]
id = "zh-14"
kind = "zh"
text = "請用繁體中文解釋為什麼鋼鐵做的船可以浮在水面上。"

[[prompt]]
id = "zh-15"
kind = "zh"
text = "請用繁體中文說明垃圾分類與資源回收為什麼重要，以及回收的東西後來去了哪裡。"

[[prompt]]
id = "zh-16"
kind = "zh"
text = "請用繁體中文介紹茶葉從採收到製成烏龍茶的過程。"

[[prompt]]
id = "zh-17"
kind = "zh"
text = "請用繁體中文解釋搜尋引擎是怎麼決定哪些網頁排在前面的。"

[[prompt]]
id = "zh-18"
kind = "zh"
text = "請用繁體中文說明梅雨是什麼，以及它對臺灣的水資源為什麼重要。"

[[prompt]]
id = "zh-19"
kind = "zh"
text = "請用繁體中文解釋抗生素的作用，以及抗藥性是怎麼產生的。"

[[prompt]]
id = "zh-20"
kind = "zh"
text = "請用繁體中文說明活字印刷術的發明，如何改變了知識的傳播。"

# ── tai：台語漢字（教育部推薦用字的寫法；樣本很少，只當補充）──────
[[prompt]]
id = "tai-01"
kind = "tai"
text = "請用台語漢字寫一段短文，講你透早去菜市仔買菜的情形。"

[[prompt]]
id = "tai-02"
kind = "tai"
text = "請用台語漢字解說：是按怎落雨進前，天會變甲烏烏暗暗？"

[[prompt]]
id = "tai-03"
kind = "tai"
text = "請用台語漢字寫一張批予阿媽，共伊講你最近讀冊的代誌。"

[[prompt]]
id = "tai-04"
kind = "tai"
text = "請用台語漢字紹介台南的小食，上無愛講著三項。"

[[prompt]]
id = "tai-05"
kind = "tai"
text = "請用台語漢字講一个古早的故事，主角是一隻狗仔。"

[[prompt]]
id = "tai-06"
kind = "tai"
text = "請用台語漢字說明，囡仔人是按怎愛早睏早起。"
