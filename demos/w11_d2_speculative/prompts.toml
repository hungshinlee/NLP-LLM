# 此檔由 bin/publish_demos.py 從 private repo 的 <course>/demos/ 複製而來，請勿在公開 repo 直接編輯。
# W11 demo 2 (b) 的 prompt。全部是為這個 demo 自己寫的，沒有取自任何資料集。
# kind：code（程式碼）、en（英文說明文）、zh（繁體中文說明文）、tai（台語漢字，只有幾個）。
# 每個 prompt 都要求一段夠長的輸出（demo_config.toml 的 max_tokens 之內通常寫不完）。

# ── code ────────────────────────────────────────────────────────
[[prompt]]
id = "code-01"
kind = "code"
text = "Write a Python function that checks whether a string is a valid IPv4 address. Include a docstring and a few example calls."

[[prompt]]
id = "code-02"
kind = "code"
text = "Write a Python class for a fixed-capacity LRU cache with get and put methods, using only the standard library."

[[prompt]]
id = "code-03"
kind = "code"
text = "Write a Python function that merges two sorted lists into one sorted list without using sort(), and then a function that uses it to implement merge sort."

[[prompt]]
id = "code-04"
kind = "code"
text = "Write a Python script that reads a CSV file given on the command line and prints the mean, minimum and maximum of every numeric column."

[[prompt]]
id = "code-05"
kind = "code"
text = "Implement binary search in Python, both iteratively and recursively, and add unit tests with the unittest module."

[[prompt]]
id = "code-06"
kind = "code"
text = "Write a Python function that parses a simple arithmetic expression with +, -, *, / and parentheses and returns its value, without using eval."

[[prompt]]
id = "code-07"
kind = "code"
text = "Write a Python generator that yields the prime numbers, and a function that returns the first n primes using it."

[[prompt]]
id = "code-08"
kind = "code"
text = "Write a Python dataclass for a 2D vector with addition, subtraction, scalar multiplication, dot product and length."

[[prompt]]
id = "code-09"
kind = "code"
text = "Write a JavaScript function that debounces another function, and show how to use it on a text input's input event."

[[prompt]]
id = "code-10"
kind = "code"
text = "Write a SQL schema for a small library (books, members, loans) and three queries: overdue loans, the most borrowed book, and members with no loans."

[[prompt]]
id = "code-11"
kind = "code"
text = "Write a Python function that walks a directory tree and returns the ten largest files with their sizes, using pathlib."

[[prompt]]
id = "code-12"
kind = "code"
text = "Write a Python implementation of a trie with insert, search and starts_with methods."

[[prompt]]
id = "code-13"
kind = "code"
text = "Write a Bash script that backs up a directory into a dated tar.gz file and deletes backups older than seven days."

[[prompt]]
id = "code-14"
kind = "code"
text = "Write a Python function that computes the Levenshtein edit distance between two strings with dynamic programming, and explain the recurrence in comments."

[[prompt]]
id = "code-15"
kind = "code"
text = "Write a Python context manager that measures how long a block of code takes and prints the elapsed time, first as a class and then with contextlib."

[[prompt]]
id = "code-16"
kind = "code"
text = "Write a C function that reverses a singly linked list in place, with the struct definition and a small main that tests it."

[[prompt]]
id = "code-17"
kind = "code"
text = "Write a Python function that counts word frequencies in a text file and prints the twenty most common words, ignoring case and punctuation."

[[prompt]]
id = "code-18"
kind = "code"
text = "Write a Python implementation of breadth-first search on a graph given as an adjacency list, returning the shortest path between two nodes."

[[prompt]]
id = "code-19"
kind = "code"
text = "Write a Python decorator that retries a function up to three times with exponential backoff when it raises an exception."

[[prompt]]
id = "code-20"
kind = "code"
text = "Write a NumPy function that standardizes each column of a matrix to zero mean and unit variance, handling columns whose variance is zero."

