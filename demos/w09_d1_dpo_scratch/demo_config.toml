# 此檔由 bin/publish_demos.py 從 private repo 的 <course>/demos/ 複製而來，請勿在公開 repo 直接編輯。
# W9 demo 1（投影片 p33 前導頁、p35「Live: demo 1 (a)」、p36「Replay: demo 1 (b)」）的設定
#
# 改這個檔就能換 β 的網格、規則的門檻、取樣幾段、訓練幾步，不必動程式。
# 模型、adapter、旁路（rank、scale、接在哪些層）讀 demo 2 的 demo_config.toml（../w09_d2_grpo_scratch/）——三個 demo 同一個 π_ref。

[demo]
title = "W9 · Demo 1 — DPO: a few lines of loss, five tests, one real run"
source = "../w09_d2_grpo_scratch"
# 隨機種子：(a) 的輸入、取樣、旁路的初始化、每個 epoch 的洗牌都用它。
seed = 20261115

# ── (a) 現場：五個測試用的輸入（編出來的 log 機率，不載模型）────────
[live]
n_pairs = 6
beta = 0.1
# 測試 (ii)：logp_w 每個加多少。
raise_by = 1.0
# 測試 (iii)：logp_w 與 logp_l 同時加的常數，依序印。
shifts = [5.0, -50.0]
# 測試 (iv)：β 的兩頭。
beta_small = 1e-4
beta_large = 50.0

# ── (b) 偏好對從哪些 prompt 來 ─────────────────────────────────
[data]
# 上週 demo 1 的 Dolly 切分（databricks-dolly-15k，CC BY-SA 3.0）。只用 user 那一輪；資料裡的人寫回答不用。
dir = "../w08_d1_sft_base_to_assistant/data"
# 訓練用的偏好對：valid.jsonl 的 prompt（上週只用來量 validation loss，adapter C 沒有在上面訓過）。
train_file = "valid.jsonl"
# test.jsonl 依序切兩段，互不重疊：前 n_heldout_pair_prompts 個做「沒訓過的偏好對」，接著 n_gold_prompts 個只用來取樣量 gold。
heldout_file = "test.jsonl"
n_heldout_pair_prompts = 40
n_gold_prompts = 48
# 套完 chat template 之後超過這個 token 數的 prompt 不用（帶長 context 的那幾筆），訓練時的序列長度才有上限。
max_prompt_tokens = 384

# ── (b) π_ref 自己寫回答，規則配對 ─────────────────────────────
[pairs]
samples_per_prompt = 6
# 每個 prompt 最多留幾對：最好的配最差的、第二好的配第二差的。
pairs_per_prompt = 2
max_new_tokens = 160
temperature = 1.0
# 兩段都正常結束時，y_w 至少要比 y_l 短這麼多個 token 才成一對。
min_gap_tokens = 8
batch_size = 48
# pairs.json 裡留幾對的文字（會上站）；每段最多幾個字元。
n_examples = 4
max_chars = 400

# ── (b) 訓練 ───────────────────────────────────────────────────
[train]
# 一步 = batch_pairs 對 = 2 × batch_pairs 條序列一次前向、一次反向、Adam 一步。常數 LR，不做 gradient clipping。
batch_pairs = 4
steps = 200
# **初稿，沒量過**：probe 的 LR 小掃描之後改。
learning_rate = 3e-6
# π_ref 的兩個 log 機率：precomputed = pairs 那一步事先算好存檔（訓練時 π_ref 不必前向）；
# online = 每一步把旁路關掉、同一個 batch 再前向一次（第 0 步的 loss 逐位元是 log 2；多一次前向，不多一份權重）。
ref = "precomputed"
# 每隔幾步量一次：全部訓練偏好對與沒訓過的偏好對上的 loss 與兩個 log 機率；沒看過的 prompt 上取樣的長度與 KL。
eval_every = 25

[runs]
beta005 = { beta = 0.05 }
beta01  = { beta = 0.1 }
beta05  = { beta = 0.5 }

[rehearse]
runs = ["beta005", "beta01", "beta05"]

[tables]
rows = ["beta005", "beta01", "beta05"]
# replay 逐步印曲線的那一個 run。
curve = "beta01"
# p36 最後一欄用哪一段文字的 bits per byte。
ruler_key = "wikipedia"

[eval]
# 沒看過的 prompt 上每個取樣幾段；固定取樣種子，所以不同 run、不同步數之間是配對的比較。
samples_per_prompt = 2
seed = 990002
batch_size = 48
n_examples = 3
max_chars = 400

# ── bits per byte：上週 demo 4 (b) 的四段 held-out 與量法 ────────
[ruler]
source = "../w08_d4_intruders_forgetting"
keys = ["en_paragraph", "zh_paragraph", "wikipedia", "edu_tail"]
# 每段最多取幾個 byte（0 = 整段，與上週相同；1 MiB 一段在 1.7B 上約一分鐘）。
max_bytes = 0

# ── probe：一步幾秒、LR 小掃描 ─────────────────────────────────
[probe]
beta = 0.1
lrs = [1e-6, 3e-6, 1e-5]
steps = 40
# 掃描時每個 LR 訓練前後各在這麼多對訓練偏好對上量一次。
n_pairs = 64

# ── tiny：亂數權重的小模型，不下載任何東西，只為了走一遍真的流程 ──
[tiny]
n_train_prompts = 40
n_heldout_pair_prompts = 12
n_gold_prompts = 12
max_new_tokens = 14
min_gap_tokens = 2
learning_rate = 3e-3
steps = 40
eval_every = 10
