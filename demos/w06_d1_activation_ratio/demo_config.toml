# 此檔由 bin/publish_demos.py 從 private repo 的 <course>/demos/ 複製而來，請勿在公開 repo 直接編輯。
# W6 demo 1（投影片 p11 前導頁、p12「Live: demo 1 — N_total, N_active, ρ from the config」）的設定
#
# 四個模型、四列表格。順序就是投影片表格的順序（count 不帶參數時照這個順序印）。
# 換模型只改這裡；鍵名的解讀規則在 count_moe.py 的 moe_spec()，加新家族時在那裡加鍵名。

[models.gemma]
repo = "mlx-community/gemma-4-26B-A4B-it-4bit"
label = "Gemma 4 26B-A4B (this machine; MLX 4-bit, W1 demo 1)"
local = true            # 讀本機 HF cache：config.json 加 *.safetensors 的 header（只讀 header，不載權重）。不抓任何東西
note = "MoE 鍵在 text_config 底下、top-k 叫 top_k_experts；dense 的 intermediate_size 同時存在——每層是 dense FFN + MoE 還是二選一，config 看不出來，看 safetensors 的 shape"

[models.qwen30]
repo = "Qwen/Qwen3-30B-A3B"
label = "Qwen3-30B-A3B (bf16 checkpoint; config + shard headers only)"
note = "128 experts、每 token 8 個、沒有 shared expert；q_norm／k_norm 在每層"

[models.qwen_next]
repo = "Qwen/Qwen3-Next-80B-A3B-Instruct"
label = "Qwen3-Next-80B-A3B (interleaved hybrid: 3 Gated DeltaNet : 1 gated attention; config + shard headers only)"
note = "512 experts、每 token 10 個、1 個 shared（寬 512 = expert 寬）；checkpoint 另含 MTP 模組，不算進 N"

[models.kimi]
repo = "moonshotai/Kimi-Linear-48B-A3B-Instruct"
label = "Kimi Linear 48B-A3B (interleaved hybrid: 3 KDA : 1 MLA; config + shard headers only)"
note = "256 experts、每 token 8 個、1 個 shared；第 1 層 dense（first_k_dense_replace = 1）；鍵名 num_experts_per_token、num_shared_experts"

[fetch]
# ./present.sh fetch 只抓這些（純標準函式庫的 HTTP range 請求）：config.json、model.safetensors.index.json，
# 以及每個 shard 的 header（檔頭 8 bytes 的長度 + 緊接的 JSON；bf16 的 30B 模型十幾個 shard、每個 header 幾十 KB）。
# 不抓權重。結果放 configs/<org>--<name>/（config.json、index、tensors.json.gz），進版控（三個模型壓縮後合計不到 1 MB）。
revision = "main"
hf_endpoint = "https://huggingface.co"

[rehearse]
# ./present.sh rehearse 寫 runs/rehearsal/ratios.json；replay 讀它。
out = "runs/rehearsal/ratios.json"
