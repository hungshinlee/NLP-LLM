# 此檔由 bin/publish_demos.py 從 private repo 的 <course>/demos/ 複製而來，請勿在公開 repo 直接編輯。
# W7 demo 2（投影片 p33「Replay: demo 2 — five points, one ray, the extrapolation error」；p32 前導頁）的設定。
#
# 全部**課前彩排、課堂只 replay**。模型是 W4 demo 1 的 tiny GPT（block_final.GPT，從檔案路徑載入），改成 byte-level（V = 256）；
# 語料是 FineWeb-Edu sample-10BT 第一個 parquet shard 上等距抽出的約 200 MB（fetch 一次，demo 3、4 共用，見 [corpus]）。
# 五個尺寸都在 Chinchilla 的射線 D = 20N 上（[ray]）；同一份語料、同一個 seed；learning rate 照 muP 的寬度縮放（[train].lr_base × d_base / d）。
# 換尺寸只改 [[sizes]]；換射線只改 [ray]。算法在 train.py（訓練）、fit.py（擬合與 envelope）、demo.py（流程）。

[shared]
demo1 = "../w04_d1_block_scratch"      # 從這裡載 block_final.py（GPT）與 train.py（pick_device、param_groups、lr_at、evaluate）；不複製程式

[corpus]
# 兩份語料共用一個資料夾（demos/.gitignore 擋掉）；fetch 用 huggingface_hub 的 HfFileSystem 只讀第一個 parquet shard 裡**等距挑出**的 row group（shard 內的列依 dump 排，讀「前面」會全是同一個 dump），
# 累到 target_mb 就停，存成 JSONL（一行一篇：id、dump、url、date、token_count、score、text）——demo 4 純標準函式庫，所以不存 parquet。
dir = "../w07_corpus"
target_mb = 200                        # 文字的 UTF-8 bytes 總量；兩份語料都是這個數（demo 3 的「等 byte」在這裡保證）
[corpus.edu]                           # demo 2 用這份；demo 3 的 FineWeb-Edu 那條、demo 4 的語料也是它
repo = "HuggingFaceFW/fineweb-edu"
path = "sample/10BT/000_00000.parquet"
file = "fineweb_edu.jsonl"
license = "ODC-By 1.0"
[corpus.web]                           # demo 3 的對照組；demo 2 不用
repo = "HuggingFaceFW/fineweb"
path = "sample/10BT/000_00000.parquet"
file = "fineweb.jsonl"
license = "ODC-By 1.0"

[split]
held_out_mb = 1                        # 語料**尾端**的文件切成 held-out（整篇、不切半），約 1 MiB；其餘是 train
subset_windows = 64                    # 訓練中每 record.every 步量一次的固定子集：held-out 開頭 64 個不重疊視窗（64 × 256 = 16,384 bytes）
sep = "\n\n"                           # 文件之間的分隔；V 固定 256，沒有 EOS token

[ray]
tokens_per_param = 20                  # D = 20N：Chinchilla 的射線（Hoffmann et al. 2022 Table 3 讀出來的那個數；Eq. (10) 的最優比不是常數，demo 1 (a)）
count = "total"                        # N 算哪一個：total（含 embedding；Chinchilla）或 nonemb（Kaplan）。兩個都印，射線與擬合用這個

[train]
device = "mps"                         # 沒有 MPS 自動退 CPU（會印出來）
batch = 32
L = 256                                # context，沿 W4（沒有位置編碼：W4 的 block；W5 的 RoPE 不加——五個尺寸同一個架構就好）
lr_base = 1e-3                         # W4 demo 1 在 d = 256 的 AdamW lr
d_base = 256
lr_rule = "mup_width"                  # lr(d) = lr_base × d_base / d：muP 在 Adam 下 hidden 矩陣的規則（W4〈關鍵數學〉5）。只做 lr 這一半；
                                       # 初始化（std 0.02）與輸出層乘子沒按 muP 改——README 寫明，這是 Porian 第三個原因的「部分修補」
betas = [0.9, 0.95]
weight_decay = 0.1                     # decoupled，只加在矩陣上（W4 的 param_groups）
warmup_frac = 0.03                     # warmup = max(20, 3% 的步數)；W4 是 100/3000
grad_clip = 1.0
dropout = 0.0                          # 語料 200 MB、每個 run 不到一個 epoch，不需要 W4 的 0.1
seed = 1
eval_stride = 128                      # 訓完對整段 held-out 跑 W4 的 evaluate（視窗 L、stride 128）
d_head = 32                            # n_head = d / d_head，沿 W4
sample_bytes = 300                     # 訓完生成幾個 byte 放進紀錄（只是看看）

[record]
every = 50                             # 每 50 步在固定子集上量一次 held-out（大綱：每 50 步）；每筆也記 tokens_seen，envelope 用
log_every = 100

# 五個尺寸：d 是 32 的倍數（d_head 32）、層數隨 d 加、d_ff ≈ 8d/3 取 16 的倍數。N 以 count 的規則算（含 embedding 256·d）；
# 約 0.21 M → 9.9 M，相鄰比 2.1–3.1，跨 1.7 個數量級。順序＝投影片表格的順序；fit_with 是「最小的三個」。
[[sizes]]
key = "s1"
d = 64
n_layer = 4
d_ff = 176
[[sizes]]
key = "s2"
d = 96
n_layer = 5
d_ff = 256
[[sizes]]
key = "s3"
d = 128
n_layer = 6
d_ff = 336
[[sizes]]
key = "s4"
d = 192
n_layer = 7
d_ff = 512
[[sizes]]
key = "s5"
d = 320
n_layer = 8
d_ff = 848

[fit]
fit_with = ["s1", "s2", "s3"]          # 三點擬合 L(N) = E + A N^-α（沿射線，D 那一項併進 A）
test_on = ["s4", "s5"]                 # 外插到這兩個
alpha_lo = 0.01
alpha_hi = 3.0                         # α 的搜尋區間（log 等分格點 + 黃金分割細化）；E、A 對每個 α 是線性最小平方
envelope_points = 13                   # iso-FLOPs envelope：C 的格點數（log 等分，從最小 run 的 C 到最大 run 的 C）

[rehearse]
out = "runs/rehearsal"
weights = "runs/weights"               # state_dict，demo 3 (b) 讀 s3 那份；不進版控
