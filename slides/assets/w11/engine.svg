<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 388" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="30" width="230" height="330" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="38" y="66" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">request queue</text><rect x="38" y="92" width="150" height="22" rx="4" fill="#c7d7f5" stroke="#0b5cad" stroke-width="1.2"/><text x="38" y="140" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">long prompt</text><rect x="38" y="154" width="60" height="22" rx="4" fill="#c7d7f5" stroke="#0b5cad" stroke-width="1.2"/><text x="38" y="202" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">short</text><rect x="38" y="216" width="110" height="22" rx="4" fill="#c7d7f5" stroke="#0b5cad" stroke-width="1.2"/><text x="38" y="264" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">medium</text><rect x="38" y="278" width="40" height="22" rx="4" fill="#c7d7f5" stroke="#0b5cad" stroke-width="1.2"/><text x="38" y="326" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">short</text><line x1="254" y1="195" x2="296" y2="195" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-engine)"/><rect x="300" y="78" width="380" height="234" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="318" y="118" font-size="27" fill="#0b5cad" text-anchor="start" font-weight="700">scheduler</text><text x="318" y="152" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">at every step, decides who is</text><text x="318" y="184" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">in the batch:</text><text x="318" y="216" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">new → prefill</text><text x="318" y="248" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">running → decode</text><text x="318" y="280" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">finished → leave</text><line x1="684" y1="150" x2="726" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-engine)"/><rect x="730" y="30" width="290" height="150" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="748" y="70" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">execution engine</text><text x="748" y="104" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">one forward pass</text><text x="748" y="136" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">for this step's batch</text><line x1="1024" y1="105" x2="1056" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-engine)"/><rect x="1060" y="30" width="160" height="330" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="1076" y="66" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">streams</text><text x="1076" y="104" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">one per</text><text x="1076" y="134" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">request,</text><text x="1076" y="164" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">a token</text><text x="1076" y="194" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">at a time</text><g class="fragment" data-fragment-index="1"><line x1="684" y1="240" x2="726" y2="285" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-engine)"/><rect x="730" y="210" width="290" height="150" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="748" y="250" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">KV block manager</text><text x="748" y="284" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">logical → physical</text><text x="748" y="316" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">blocks: a page table</text><line x1="875" y1="184" x2="875" y2="206" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-engine)"/></g></svg>