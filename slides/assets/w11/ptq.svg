<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 404" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-ptq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="28" font-size="27" fill="#0b5cad" text-anchor="start" font-weight="700">calibration — once</text><rect x="20" y="44" width="280" height="122" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="38" y="80" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the trained weights</text><text x="38" y="112" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">16 bits each</text><line x1="303" y1="105" x2="326" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-ptq)"/><rect x="330" y="44" width="280" height="122" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="348" y="80" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">a small calibration set</text><text x="348" y="112" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">run through the model</text><line x1="613" y1="105" x2="636" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-ptq)"/><rect x="640" y="44" width="270" height="122" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="658" y="80" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">per-layer statistics</text><text x="658" y="112" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">how large the inputs</text><text x="658" y="142" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">to each layer are</text><line x1="913" y1="105" x2="936" y2="105" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-ptq)"/><rect x="940" y="44" width="280" height="122" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="958" y="80" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the result</text><text x="958" y="112" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">integer codes, and</text><text x="958" y="142" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">one scale per group</text><g class="fragment" data-fragment-index="1"><text x="20" y="238" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">use — every token</text><rect x="20" y="254" width="280" height="122" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="38" y="290" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">in memory</text><text x="38" y="322" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">codes and scales only</text><line x1="303" y1="315" x2="326" y2="315" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-ptq)"/><rect x="330" y="254" width="280" height="122" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="348" y="290" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">on the fly</text><text x="348" y="322" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">codes → bf16 values</text><line x1="613" y1="315" x2="636" y2="315" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-ptq)"/><rect x="640" y="254" width="270" height="122" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="658" y="290" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the arithmetic</text><text x="658" y="322" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">in bf16, as before</text><line x1="913" y1="315" x2="936" y2="315" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-ptq)"/><rect x="940" y="254" width="280" height="122" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="958" y="290" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">gone</text><text x="958" y="322" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the calibration data</text><text x="958" y="352" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">and the statistics</text><rect x="940" y="254" width="280" height="122" rx="8" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="8 6"/></g></svg>