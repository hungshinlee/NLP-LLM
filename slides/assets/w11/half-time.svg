</svg><text x="506.863" y="170" font-size="23" fill="#15803d" text-anchor="start" font-weight="400" textLength="165.3" lengthAdjust="spacing">; a long context</text><text x="447" y="200" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">cannot be batched away</text><line x1="815" y1="135" x2="831" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="834" y="58" width="386" height="154" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><circle cx="868" cy="93" r="18" fill="#15803d"/><text x="868" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">✓</text><text x="898" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Finding the batch</text><text x="854" y="140" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">schedule by step, page the</text><text x="854" y="170" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">KV, chunk long prompts,</text><text x="854" y="200" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">split the two phases</text><text x="20" y="266" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Second half — what does each saving cost?</text><rect x="20" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="54" cy="319" r="18" fill="#b45309"/><text x="54" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="84" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">No cost?</text><text x="40" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">faster, with exactly</text><text x="40" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the same output:</text><text x="40" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">is that possible?</text><line x1="306.25" y1="361" x2="322.25" y2="361" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="325.25" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="359.25" cy="319" r="18" fill="#b45309"/><text x="359.25" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="389.25" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Precision</text><text x="345.25" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">fewer bits per</text><text x="345.25" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">weight: what is</text><text x="345.25" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">lost, and where?</text><line x1="611.5" y1="361" x2="627.5" y2="361" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="630.5" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="664.5" cy="319" r="18" fill="#b45309"/><text x="664.5" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="694.5" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Unseen</text><text x="650.5" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the score did not</text><text x="650.5" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">move. Did the</text><text x="650.5" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">behaviour?</text><line x1="916.75" y1="361" x2="932.75" y2="361" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="935.75" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="969.75" cy="319" r="18" fill="#b45309"/><text x="969.75" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">7</text><text x="999.75" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Smaller</text><text x="955.75" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">why not just</text><text x="955.75" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">train a small</text><text x="955.75" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">model instead?</text></svg>