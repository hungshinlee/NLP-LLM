<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 344" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-last-week" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="10" width="386" height="322" rx="10" fill="#f8fafc" stroke="#1f2328" stroke-width="1.8"/><text x="38" y="46" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Counting: unit = the word</text><line x1="408" y1="170" x2="424" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-last-week)"/><text x="38" y="88" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">an n-gram is a ratio of counts</text><text x="38" y="118" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">95% of held-out 4-grams:</text><text x="38" y="148" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">never seen in training</text><text x="38" y="196" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">n = 8: the table is an index</text><text x="38" y="226" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">of the corpus</text><text x="38" y="278" font-size="23" fill="#15803d" text-anchor="start" font-weight="700">fix: a function, not a table</text><text x="38" y="308" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">(W1 p43)</text><rect x="427" y="10" width="386" height="322" rx="10" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><text x="445" y="46" font-size="27" fill="#0b5cad" text-anchor="start" font-weight="700">Vectors: unit = the word</text><line x1="815" y1="170" x2="831" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-last-week)"/><text x="445" y="88" font-size="23" fill="#dc2626" text-anchor="start" font-weight="400">nearest to love: hate (0.412)</text><text x="445" y="118" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">grave: two senses, one vector</text><text x="445" y="166" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">prospero, sebastian, gonzalo:</text><text x="445" y="196" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">no vector at all —</text><text x="445" y="226" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">5.7% of held-out words</text><text x="445" y="278" font-size="23" fill="#15803d" text-anchor="start" font-weight="700">fix: words from pieces</text><text x="445" y="308" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">(subwords: this week)</text><rect x="834" y="10" width="386" height="322" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/><text x="852" y="46" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Demo 2: unit = the token</text><text x="852" y="88" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">627 bytes, two tokenizers</text><text x="1084" y="126" font-size="23" fill="#1f2328" text-anchor="end" font-weight="700">Qwen3.8</text><text x="1192" y="126" font-size="23" fill="#1f2328" text-anchor="end" font-weight="700">Mistral</text><text x="852" y="162" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">tokens</text><text x="1084" y="162" font-size="23" fill="#1f2328" text-anchor="end" font-weight="700">141</text><text x="1192" y="162" font-size="23" fill="#1f2328" text-anchor="end" font-weight="700">272</text><text x="852" y="196" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">perplexity</text><text x="1084" y="196" font-size="23" fill="#dc2626" text-anchor="end" font-weight="700">12.2</text><text x="1192" y="196" font-size="23" fill="#dc2626" text-anchor="end" font-weight="700">9.1</text><text x="852" y="230" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">bits / byte</text><text x="1084" y="230" font-size="23" fill="#15803d" text-anchor="end" font-weight="700">0.81</text><text x="1192" y="230" font-size="23" fill="#15803d" text-anchor="end" font-weight="700">1.38</text><text x="852" y="278" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">lower perplexity,</text><text x="852" y="308" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">worse model (W1 p31)</text></svg>