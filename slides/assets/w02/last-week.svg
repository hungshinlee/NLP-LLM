</svg><text x="195" y="150" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="400">95% of held-out 4-grams never seen</text><text x="195" y="178" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="400">n = 8: the table is an index of the corpus</text><text x="195" y="218" font-size="16" fill="#15803d" text-anchor="middle" font-weight="400">fix: replace the table with a function</text><text x="195" y="240" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400">(parameter sharing: W1 p37)</text><line x1="372" y1="150" x2="418" y2="150" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah-last-week)"/><rect x="422" y="40" width="380" height="230" rx="10" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><text x="612" y="70" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="700">one vector per word: unit = the word</text><text x="612" y="112" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="400">nearest neighbour of love: hate (cosine 0.412)</text><text x="612" y="140" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="400">grave: buried, bury, … quiet — senses superposed</text><text x="612" y="168" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="700">prospero, sebastian, gonzalo: no vector at all</text><text x="612" y="196" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400">(5.7% of the held-out words)</text><text x="612" y="230" font-size="16" fill="#15803d" text-anchor="middle" font-weight="400">fix for the last one: build words from pieces</text><text x="612" y="252" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400">(fastText → subwords: this week)</text><line x1="804" y1="150" x2="850" y2="150" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah-last-week)"/><rect x="854" y="40" width="366" height="230" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/><text x="1037" y="70" font-size="19" fill="#b45309" text-anchor="middle" font-weight="700">W1 demo 2: unit = the token</text><text x="1037" y="104" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="400">same 627 bytes, two tokenizers</text><text x="1050" y="134" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">Qwen3.8</text><text x="1160" y="134" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">Mistral</text><text x="930" y="162" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="400">tokens</text><text x="1050" y="162" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="700">141</text><text x="1160" y="162" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="700">272</text><text x="930" y="190" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="400">perplexity</text><text x="1050" y="190" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="700">12.2</text><text x="1160" y="190" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="700">9.1</text><text x="930" y="218" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="400">bits / byte</text><text x="1050" y="218" font-size="17" fill="#15803d" text-anchor="middle" font-weight="700">0.81</text><text x="1160" y="218" font-size="17" fill="#15803d" text-anchor="middle" font-weight="700">1.38</text><text x="1037" y="252" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="400">the lower perplexity is the worse model (W1 p28)</text><g class="fragment" data-fragment-index="1"><rect x="20" y="290" width="1200" height="90" rx="9" fill="#fff5f5" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/><text x="40" y="324" font-size="20" fill="#dc2626" text-anchor="start" font-weight="700">in all three, someone decided what the unit is — and the model never got a vote.</text><text x="40" y="354" font-size="16" fill="#1f2328" text-anchor="start" font-weight="400">a word the counts never saw is zero; a word the vocabulary never saw has nothing; a token count the text did not choose sits in the denominator.</text></g></svg>