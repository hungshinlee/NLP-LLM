" font-size="17" fill="#6b7280" text-anchor="start" font-weight="400">left to right, three at a time</text></g><g class="fragment" data-fragment-index="2"><text x="20" y="188" font-size="20" fill="#1f2328" text-anchor="start" font-weight="700">Qwen  \p{N}</text><rect x="420" y="160" width="34.12" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="437.06" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">1</text><rect x="460.12" y="160" width="34.12" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="477.18" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">2</text><rect x="500.24" y="160" width="34.12" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="517.3" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">3</text><rect x="540.36" y="160" width="34.12" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="557.42" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">4</text><rect x="580.48" y="160" width="34.12" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="597.54" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">5</text><rect x="620.6" y="160" width="34.12" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="637.66" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">6</text><rect x="660.72" y="160" width="34.12" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="677.78" y="191.36" font-size="26" fill="#1f2328" tex