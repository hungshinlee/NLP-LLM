<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 392" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-digits" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="46" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700" font-family="SF Mono,Menlo,Consolas,monospace">GPT-2  \p{N}+</text><rect x="420" y="16" width="130.84" height="44" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/><text x="485.42" y="47.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">1234567</text><text x="572.84" y="46" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">one span; the split depends on corpus frequency</text><g class="fragment" data-fragment-index="1"><text x="20" y="118" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700" font-family="SF Mono,Menlo,Consolas,monospace">cl100k / o200k  \p{N}{1,3}</text><rect x="420" y="88" width="66.36" height="44" rx="6" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.4"/><text x="453.18" y="119.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">123</text><rect x="492.36" y="88" width="66.36" height="44" rx="6" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.4"/><text x="525.54" y="119.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">456</text><rect x="564.72" y="88" width="36" height="44" rx="6" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.4"/><text x="582.72" y="119.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">7</text><text x="622.72" y="118" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">left to right, three at a time</text></g><g class="fragment" data-fragment-index="2"><text x="20" y="190" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700" font-family="SF Mono,Menlo,Consolas,monospace">Qwen  \p{N}</text><rect x="420" y="160" width="36" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="438" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">1</text><rect x="462" y="160" width="36" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="480" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">2</text><rect x="504" y="160" width="36" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="522" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">3</text><rect x="546" y="160" width="36" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="564" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">4</text><rect x="588" y="160" width="36" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="606" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">5</text><rect x="630" y="160" width="36" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="648" y="191.36" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">6</text><rect x="672" y="160" width="36" height="44" rx="6" fill="#e0e7ff" stroke="#d1d5db" stroke-width="1.4"/><text x="690" y="191.36" font-size="26" fill="#1f2328" text-anchor="midd