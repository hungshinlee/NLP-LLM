<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 420" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah-bytes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="44" font-size="44" fill="#1f2328" text-anchor="start" font-weight="400">我</text><text x="84" y="30" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">U+6211</text><text x="84" y="54" font-size="18" fill="#6b7280" text-anchor="start" font-weight="400">BMP · 3 bytes in UTF-8</text><rect x="360" y="16" width="56" height="40" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="388" y="43.2" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">E6</text><rect x="420" y="16" width="56" height="40" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="448" y="43.2" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">88</text><rect x="480" y="16" width="56" height="40" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="508" y="43.2" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">91</text><text x="640" y="44" font-size="44" fill="#1f2328" text-anchor="start" font-weight="400">𠊎</text><text x="704" y="30" font-size="20" fill="#6b7280" text-anchor="start" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">U+2028E</text><text x="704" y="54" font-size="18" fill="#6b7280" text-anchor="start" font-weight="400">SIP (plane 2) · 4 bytes in UTF-8</text><rect x="980" y="16" width="56" height="40" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="1008" y="43.2" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">F0</text><rect x="1040" y="16" width="56" height="40" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="1068" y="43.2" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">A0</text><rect x="1100" y="16" width="56" height="40" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="1128" y="43.2" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">8A</text><rect x="1160" y="16" width="56" height="40" rx="6" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="1188" y="43.2" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">8E</text><g class="fragment" data-fragment-index="1"><text x="20" y="122" font-size="21" fill="#1f2328" text-anchor="start" font-weight="700">byte-level BPE (GPT-2, Qwen, Llama 3)</text><text x="20" y="146" font-size="17" fill="#6b7280" text-anchor="start" font-weight="400">alphabet = 256 bytes; merges may glue some of them</text><rect x="620" y="100" width="60" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="650" y="125.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">F0</text><rect x="684" y="100" width="60" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="714" y="125.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">A0</text><rect x="748" y="100" width="60" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="778" y="125.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">8A</text><rect x="812" y="100" width="60" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="842" y="125.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">8E</text><text x="888" y="126" font-size="16" fill="#6b7280" text-anchor="start" font-weight="400">or fewer, if the corpus had this byte pair</text><text x="1220" y="162" font-size="18" fill="#15803d" text-anchor="end" font-weight="400">≤ 4 tokens, never UNK</text></g><g class="fragment" data-fragment-index="2"><text x="20" y="202" font-size="21" fill="#1f2328" text-anchor="start" font-weight="700">byte fallback (SentencePiece: Llama 1/2, Gemma)</text><text x="20" y="226" font-size="17" fill="#6b7280" text-anchor="start" font-weight="400">alphabet = characters; an unknown one falls back to bytes</text><rect x="620" y="180" width="92" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="666" y="204.76" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">&lt;0xF0&gt;</text><rect x="716" y="180" width="92" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="762" y="204.76" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">&lt;0xA0&gt;</text><rect x="812" y="180" width="92" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="858" y="204.76" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">&lt;0x8A&gt;</text><rect x="908" y="180" width="92" height="38" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="954" y="204.76" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">&lt;0x8E&gt;</text><text x="1220" y="242" font-size="18" fill="#15803d" text-anchor="end" font-weight="400">exactly 4 tokens, never UNK</text></g><g class="fragment" data-fragment-index="3"><text x="20" y="282" font-size="21" fill="#1f2328" text-anchor="start" font-weight="700">WordPiece with [UNK] (bert-base-chinese)</text><text x="20" y="306" font-size="17" fill="#6b7280" text-anchor="start" font-weight="400">alphabet = characters; an unknown one is replaced</text><rect x="620" y="260" width="92" height="38" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="666" y="285.84" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">[UNK]</text><text x="724" y="286" font-size="17" fill="#dc2626" text-anchor="start" font-weight="400">decode(encode(x)) ≠ x</text><text x="1220" y="322" font-size="18" fill="#dc2626" text-anchor="end" font-weight="400">1 token — and the bytes are gone</text></g><g class="fragment" data-fragment-index="4"><text x="20" y="362" font-size="21" fill="#1f2328" text-anchor="start" font-weight="700">ByT5</text><text x="20" y="386" font-size="17" fill="#6b7280" text-anchor="start" font-weight="400">no vocabulary at all: every byte is a token</text><rect x="620" y="340" width="60" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/><text x="650" y="365.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">F0</text><rect x="684" y="340" width="60" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/><text x="714" y="365.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">A0</text><rect x="748" y="340" width="60" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/><text x="778" y="365.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">8A</text><rect x="812" y="340" width="60" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.4"/><text x="842" y="365.84" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">8E</text><text x="1220" y="402" font-size="18" fill="#6b7280" text-anchor="end" font-weight="400">exactly 4 tokens, always</text></g><line x1="20" y1="88" x2="1220" y2="88" stroke="#e5e7eb" stroke-width="1"/></svg>