<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 360" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="42" font-size="18" fill="#6b7280" text-anchor="start" font-weight="400">input (a full-width Ｈ and a full-width comma)</text><rect x="20" y="52" width="212.04" height="40" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.4"/><text x="126.02" y="79.92" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">Ｈello，1234567</text><rect x="20" y="130" width="270" height="96" rx="7" fill="#f8fafc" stroke="#0b5cad" stroke-width="1.8"/><text x="34" y="162" font-size="24" fill="#0b5cad" text-anchor="start" font-weight="700">normalizer</text><text x="34" y="190" font-size="17" fill="#1f2328" text-anchor="start" font-weight="400">NFC / NFKC · case · spaces</text><text x="34" y="214" font-size="16" fill="#b45309" text-anchor="start" font-weight="400">lossy: decode cannot undo it</text><line x1="290" y1="178" x2="326" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-pipeline)"/><text x="20" y="240" font-size="16" fill="#6b7280" text-anchor="start" font-weight="400">output</text><rect x="20" y="250" width="174.24" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="107.12" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">Hello, 1234567</text><g class="fragment" data-fragment-index="2"><rect x="330" y="130" width="270" height="96" rx="7" fill="#f8fafc" stroke="#0b5cad" stroke-width="1.8"/><text x="344" y="162" font-size="24" fill="#0b5cad" text-anchor="start" font-weight="700">pre-tokenizer</text><text x="344" y="190" font-size="17" fill="#1f2328" text-anchor="start" font-weight="400">a regex cuts text into spans</text><text x="344" y="214" font-size="16" fill="#b45309" text-anchor="start" font-weight="400">digits and spaces decided here</text><line x1="600" y1="178" x2="636" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-pipeline)"/><text x="330" y="240" font-size="16" fill="#6b7280" text-anchor="start" font-weight="400">output</text><rect x="330" y="250" width="73.8" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="366.9" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">Hello</text><rect x="407.8" y="250" width="34" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="424.8" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">,</text><rect x="445.8" y="250" width="62.64" height="34" rx="6" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.4"/><text x="477.12" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">␣123</text><rect x="512.44" y="250" width="51.48" height="34" rx="6" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.4"/><text x="538.18" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">456</text><rect x="567.92" y="250" width="34" height="34" rx="6" fill="#fef3c7" stroke="#d1d5db" stroke-width="1.4"/><text x="584.92" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">7</text></g><g class="fragment" data-fragment-index="3"><rect x="640" y="130" width="270" height="96" rx="7" fill="#f8fafc" stroke="#0b5cad" stroke-width="1.8"/><text x="654" y="162" font-size="24" fill="#0b5cad" text-anchor="start" font-weight="700">model</text><text x="654" y="190" font-size="17" fill="#1f2328" text-anchor="start" font-weight="400">BPE / WordPiece / Unigram</text><text x="654" y="214" font-size="16" fill="#b45309" text-anchor="start" font-weight="400">merges stay inside one span</text><line x1="910" y1="178" x2="946" y2="178" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-pipeline)"/><text x="640" y="240" font-size="16" fill="#6b7280" text-anchor="start" font-weight="400">output</text><rect x="640" y="250" width="73.8" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="676.9" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">Hello</text><rect x="717.8" y="250" width="34" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="734.8" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">,</text><rect x="755.8" y="250" width="62.64" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="787.12" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">␣123</text><rect x="822.44" y="250" width="51.48" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="848.18" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">456</text><rect x="877.92" y="250" width="34" height="34" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="894.92" y="273.48" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">7</text></g><g class="fragment" data-fragment-index="4"><rect x="950" y="130" width="270" height="96" rx="7" fill