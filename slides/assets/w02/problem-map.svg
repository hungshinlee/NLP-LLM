</svg><text x="918" y="168" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400">T depends on the tokenizer:</text><text x="918" y="188" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">141 / 164 / 272 / 627  (p10)</text><line x1="1014" y1="120" x2="1060" y2="120" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah-problem-map)"/><rect x="1064" y="74" width="150" height="92" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/><text x="1139" y="108" font-size="19" fill="#b45309" text-anchor="middle" font-weight="700">model</text><text x="1139" y="134" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="400">sees only the ids</text><g class="fragment" data-fragment-index="1"><rect x="20" y="178" width="352" height="40" rx="8" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/><text x="196" y="204" font-size="17" fill="#dc2626" text-anchor="middle" font-weight="700">the model never sees any of this</text></g><g class="fragment" data-fragment-index="2"><rect x="20" y="232" width="1200" height="56" rx="9" fill="#fff5f5" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/><text x="40" y="266" font-size="17" fill="#dc2626" text-anchor="start" font-weight="700">fitted before training; every weight was learned against its output — replacing it afterwards means paying for training again (§9)</text></g><text x="20" y="318" font-size="16" fill="#6b7280" text-anchor="start" font-weight="400">three questions this week asks of that box:</text><text x="20" y="348" font-size="17" fill="#1f2328" text-anchor="start" font-weight="700">what the unit is (§2–4)</text><text x="420" y="348" font-size="17" fill="#1f2328" text-anchor="start" font-weight="700">what it costs each language (§6, §9)</text><text x="860" y="348" font-size="17" fill="#1f2328" text-anchor="start" font-weight="700">what the model cannot see (§7)</text><text x="1220" y="390" font-size="17" fill="#6b7280" text-anchor="end" font-weight="400">schematic — not a measurement</text></svg>