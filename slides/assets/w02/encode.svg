 stroke-width="1.4"/><text x="38" y="204.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">w</text><rect x="59" y="178" width="75.04" height="36" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.4"/><text x="96.52" y="204.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">est_</text><text x="149.04" y="204" font-size="23" fill="#0b5cad" text-anchor="start" font-weight="400">merge #5 (e+st_)</text></g><text x="640" y="30" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">“newer”: the character r never appeared</text><rect x="640" y="46" width="36" height="36" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="658" y="72.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">n</text><rect x="679" y="46" width="36" height="36" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="697" y="72.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">e</text><rect x="718" y="46" width="36" height="36" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="736" y="72.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">w</text><rect x="757" y="46" width="36" height="36" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="775" y="72.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">e</text><rect x="796" y="46" width="36" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="814" y="72.28" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">r</text><rect x="835" y="46" width="36" height="36" rx="6" fill="#fff" stroke="#d