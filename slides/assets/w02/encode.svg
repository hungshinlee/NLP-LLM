d1d5db" stroke-width="1.4"/><text x="721.78" y="160.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">e</text><rect x="742.78" y="134" width="36" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/><text x="760.78" y="160.28" font-size="23" fill="#dc2626" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">r</text><rect x="781.78" y="134" width="36" height="36" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="799.78" y="160.28" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400" font-family="SF Mono,Menlo,Consolas,monospace">_</text><text x="832.78" y="160" font-size="23" fill="#0b5cad" text-anchor="start" font-weight="400">merge #4 (ne+w)</text></g><g class="fragment" data-fragment-index="4"><text x="20" y="244" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">= 2 tokens: merges applied in rank order,</text><text x="20" y="272" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">lowest first; frequencies never recounted</text></g><g class="fragment" data-fragment-index="3"><text x="640" y="200" font-size="23" fill="#dc2626" text-anchor="start" font-weight="400">stuck: r has no id. A character alphabet</text><text x="640" y="228" font-size="23" fill="#dc2626" text-anchor="start" font-weight="400">needs UNK; a byte alphabet never does</text></g></svg>