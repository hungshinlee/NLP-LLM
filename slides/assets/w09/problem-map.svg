<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 388" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-problem-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="40" font-size="27" fill="#0b5cad" text-anchor="start" font-weight="700">First half — the examiner is a person, or learned from people</text><g class="fragment" data-fragment-index="1"><rect x="20" y="58" width="386" height="122" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><circle cx="54" cy="93" r="18" fill="#0b5cad"/><text x="54" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="84" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Choice → score</text><text x="42" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">“A is better than B”: how</text><text x="42" y="167" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">does it become a number?</text><line x1="408" y1="119" x2="424" y2="119" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="427" y="58" width="386" height="122" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><circle cx="461" cy="93" r="18" fill="#0b5cad"/><text x="461" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="491" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Score → gradient</text><text x="449" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">a score has no derivative:</text><text x="449" y="167" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">how does the model follow it?</text><line x1="815" y1="119" x2="831" y2="119" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="834" y="58" width="386" height="122" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><circle cx="868" cy="93" r="18" fill="#0b5cad"/><text x="868" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="898" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">No examiner: DPO</text><text x="856" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the pipeline is heavy: can</text><text x="856" y="167" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the examiner be skipped?</text></g><text x="20" y="234" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Second half — a program marks; then the blind spots, and the bill</text><g class="fragment" data-fragment-index="2"><rect x="20" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="54" cy="287" r="18" fill="#b45309"/><text x="54" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="84" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">A program marks</text><text x="42" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">many answers per question:</text><text x="42" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">compare within the group</text><line x1="408" y1="313" x2="424" y2="313" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="427" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="461" cy="287" r="18" fill="#b45309"/><text x="461" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="491" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">The blind spots</text><text x="449" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">every examiner can be</text><text x="449" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">fooled — how, and by what?</text><line x1="815" y1="313" x2="831" y2="313" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="834" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="868" cy="287" r="18" fill="#b45309"/><text x="868" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="898" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">The bill</text><text x="856" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">sampling plus updating:</text><text x="856" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">what does it cost?</text></g></svg>