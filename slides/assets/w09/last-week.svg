<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 444" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-last-week" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="30" font-size="21" fill="#1f2328" text-anchor="start" font-weight="700">W1 p20, after eight weeks: two entries ticked</text><rect x="20" y="46" width="560" height="36" rx="5" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="36" y="71" font-size="19" fill="#1f2328" text-anchor="start" font-weight="700">the pretraining distribution</text><text x="560" y="71" font-size="20" fill="#0b5cad" text-anchor="end" font-weight="700">✓</text><rect x="20" y="88" width="560" height="36" rx="5" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="36" y="113" font-size="19" fill="#1f2328" text-anchor="start" font-weight="700">human demonstrations</text><text x="560" y="113" font-size="20" fill="#0b5cad" text-anchor="end" font-weight="700">✓</text><rect x="20" y="130" width="560" height="36" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="36" y="155" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">human preference</text><text x="560" y="155" font-size="19" fill="#b45309" text-anchor="end" font-weight="700">today</text><rect x="20" y="172" width="560" height="36" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="36" y="197" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">a verifiable reward</text><text x="560" y="197" font-size="19" fill="#b45309" text-anchor="end" font-weight="700">today</text><rect x="20" y="214" width="560" height="36" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/><text x="36" y="239" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">retrieved knowledge</text><text x="560" y="239" font-size="19" fill="#6b7280" text-anchor="end" font-weight="400">W12</text><rect x="20" y="256" width="560" height="36" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.2"/><text x="36" y="281" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">extra compute at test time</text><text x="560" y="281" font-size="19" fill="#6b7280" text-anchor="end" font-weight="400">W10</text><text x="20" y="316" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">W1 p20 · W8 p68</text><text x="640" y="30" font-size="21" fill="#1f2328" text-anchor="start" font-weight="700">W8: what a demonstration says — and does not</text><rect x="640" y="48" width="580" height="66" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.4"/><text x="656" y="75" font-size="20" fill="#1f2328" text-anchor="start" font-weight="700">it says</text><text x="656" y="102" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">“answer like this”: a written answer, a loss on every token</text><rect x="640" y="124" width="580" height="66" rx="7" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="656" y="151" font-size="20" fill="#1f2328" text-anchor="start" font-weight="700">it never says</text><text x="656" y="178" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">“this answer is better than that one”</text><rect x="640" y="200" width="580" height="66" rx="7" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="656" y="227" font-size="20" fill="#1f2328" text-anchor="start" font-weight="700">and it was written</text><text x="656" y="254" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">by someone else, not by the model</text><text x="640" y="316" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">W8 p13, p16, p72 · no new numbers</text><g class="fragment" data-fragment-index="1"><rect x="20" y="336" width="1200" height="98" rx="9" fill="#fff5f5" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/><text x="40" y="366" font-size="19" fill="#dc2626" text-anchor="start" font-weight="700">this week opens entries three and four: the signal shrinks from a written answer to one comparison, or one score —</text><text x="40" y="396" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">and what gets scored is the model's own answer. The model trained last week is where this week starts:</text><svg x="40" y="407" width="145.4" height="20" viewBox="0 0 145.4 20"><defs>
  <style type="text/css">*{stroke-linejoin: round; stroke-linecap: butt}</style>
 </defs>
