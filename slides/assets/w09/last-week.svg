ht="400">retrieved knowledge</text><text x="562" y="279" font-size="23" fill="#6b7280" text-anchor="end" font-weight="400">W12</text><rect x="20" y="300" width="560" height="42" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="38" y="329" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">extra compute at test time</text><text x="562" y="329" font-size="23" fill="#6b7280" text-anchor="end" font-weight="400">W10</text><text x="20" y="378" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">W1 p20 · W8 p72</text><text x="640" y="34" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">W8: what a demonstration says — and does not</text><rect x="640" y="50" width="580" height="106" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="658" y="81" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">it says</text><text x="658" y="112" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">“answer like this”: a written answer, a loss on</text><text x="658" y="142" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">every token</text><rect x="640" y="166" width="580" height="76" rx="7" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="658" y="197" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">it never says</text><text x="658" y="228" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">“this answer is better than that one”</text><rect x="640" y="252" width="580" height="76" rx="7" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="658" y="283" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">and it was written</text><text x="658" y="314" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">by someone else, not by the model</text><text x="640" y="378" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">W8 p15, p18, p76 · no new numbers</text></svg>