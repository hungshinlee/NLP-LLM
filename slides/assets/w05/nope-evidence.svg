<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 420" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-nope-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="262" width="1200" height="72" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/><text x="34" y="306" font-size="23" fill="#6b7280" text-anchor="start" font-weight="700">1 · observed</text><text x="290" y="292" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">Haviv et al. 2022 (p9): a causal LM with no positional term still learns</text><text x="290" y="322" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">position (probes read it); how — counting predecessors — is a conjecture</text><g class="fragment" data-fragment-index="1"><rect x="44" y="180" width="1176" height="72" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><text x="58" y="224" font-size="23" fill="#0b5cad" text-anchor="start" font-weight="700">2 · on paper</text><text x="314" y="210" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">Kazemnejad et al. 2023: weights exist that recover absolute position</text><text x="314" y="240" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">(Thm 1, p11) and relative position. Existence, not what training finds</text></g><g class="fragment" data-fragment-index="2"><rect x="68" y="98" width="1152" height="72" rx="8" fill="#eef2ff" stroke="#15803d" stroke-width="1.8"/><text x="82" y="142" font-size="23" fill="#15803d" text-anchor="start" font-weight="700">3 · measured, small</text><text x="338" y="128" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">same paper, synthetic tasks: NoPE extrapolates as well or better.</text><text x="338" y="158" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">Demo 2 (p34) puts NoPE and RoPE in one setting: guess first</text></g><g class="fragment" data-fragment-index="3"><rect x="92" y="16" width="1128" height="72" rx="8" fill="#eef2ff" stroke="#b45309" stroke-width="1.8"/><text x="106" y="60" font-size="23" fill="#b45309" text-anchor="start" font-weight="700">4 · shipped, in part</text><text x="362" y="46" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">Llama 4 (Meta blog, not a paper): a few layers without positions,</text><text x="362" y="76" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the rest RoPE (iRoPE). No pure-NoPE LM above 7B has been shown</text></g><g class="fragment" data-fragment-index="4"><text x="20" y="372" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">Misconception 2 reads rung 3 as if it were rung 4:</text><text x="20" y="404" font-size="23" fill="#dc2626" text-anchor="start" font-weight="400">"extrapolates best" was small and synthetic; nothing has shipped NoPE on its own above 7B</text></g></svg>