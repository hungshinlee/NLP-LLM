<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 400" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-nope-evidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="256" width="1200" height="64" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/><text x="34" y="296" font-size="20" fill="#6b7280" text-anchor="start" font-weight="700">1 · observed; conjectured</text><text x="302" y="283" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">Haviv et al. 2022 (p7): a causal LM with no positional term still learns position (probes read it)</text><text x="302" y="308" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">how — "infer the number of predecessors" — is stated as a conjecture in the abstract</text><g class="fragment" data-fragment-index="1"><rect x="44" y="178" width="1176" height="64" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><text x="58" y="218" font-size="20" fill="#0b5cad" text-anchor="start" font-weight="700">2 · exists on paper</text><text x="326" y="205" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">Kazemnejad et al. 2023: weights exist that recover absolute position (Thm 1, p9) —</text><text x="326" y="230" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">and that represent relative position (abstract). Existence, not what training finds</text></g><g class="fragment" data-fragment-index="2"><rect x="68" y="100" width="1152" height="64" rx="8" fill="#eef2ff" stroke="#15803d" stroke-width="1.8"/><text x="82" y="140" font-size="20" fill="#15803d" text-anchor="start" font-weight="700">3 · measured, small scale</text><text x="350" y="127" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">same paper, synthetic reasoning tasks: NoPE extrapolates as well or better; trained</text><text x="350" y="152" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">attention ≈ T5 relative PE. Demo 2 (p32): past the training length NoPE degrades too (2.71)</text></g><g class="fragment" data-fragment-index="3"><rect x="92" y="22" width="1128" height="64" rx="8" fill="#eef2ff" stroke="#b45309" stroke-width="1.8"/><text x="106" y="62" font-size="20" fill="#b45309" text-anchor="start" font-weight="700">4 · shipped — in part</text><text x="374" y="49" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">Llama 4 (Meta blog, not a paper): a few layers without positions, the rest RoPE — iRoPE</text><text x="374" y="74" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">no pure-NoPE LM above 7B shown; the blog gives no layer count, so none is drawn</text></g><g class="fragment" data-fragment-index="4"><text x="20" y="352" font-size="20" fill="#dc2626" text-anchor="start" font-weight="700">Misconception 2 reads rung 3 as if it were rung 4:</text><text x="20" y="380" font-size="19" fill="#dc2626" text-anchor="start" font-weight="400">"extrapolates best" was small and synthetic; nothing has shipped NoPE on its own above 7B</text></g></svg>