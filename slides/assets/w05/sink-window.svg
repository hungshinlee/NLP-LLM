oke-dasharray="3 3"/><rect x="260" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="310" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="360" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="410" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="460" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="510" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="560" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="610" y="160" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="660" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="710" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="760" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="810" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="860" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="910" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="960" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="1010" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="1060" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="1110" y="160" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><text x="1133" y="184" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">now</text><text x="60" y="236" font-size="17" fill="#dc2626" text-anchor="start" font-weight="400">W3 p40: the first token is where softmax dumps the mass no key deserves (every query can see it). Evict it, and that mass must land on</text><text x="60" y="262" font-size="17" fill="#dc2626" text-anchor="start" font-weight="400">real keys — every row's distribution jumps at once; perplexity explodes as soon as the stream passes W (StreamingLLM, Fig. 1)</text><g class="fragment" data-fragment-index="1"><text x="60" y="316" font-size="19" fill="#15803d" text-anchor="start" font-weight="700">sliding window W + the first n_sink tokens kept: the dump is still there — stable far beyond L_train</text><rect x="60" y="330" width="46" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="83" y="354" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400">s</text><rect x="110" y="330" width="46" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="133" y="354" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400">s</text><rect x="160" y="330" width="46" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="183" y="354" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400">s</text><rect x="210" y="330" width="46" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/><text x="233" y="354" font-size="12" fill="#b45309" text-anchor="middle" font-weight="400">s</text><rect x="260" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="310" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="360" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="410" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="460" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="510" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="560" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="610" y="330" width="46" height="36" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="660" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="710" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="760" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="810" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="860" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="910" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="960" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="1010" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="1060" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><rect x="1110" y="330" width="46" height="36" rx="4" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.2"/><text x="1133" y="354" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="700">now</text><text x="60" y="404" font-size="17" fill="#6b7280" text-anchor="start" font-weight="400">positions are re-assigned inside the cache (relative to what is kept), not the original indices</text><rect x="60" y="428" width="1120" height="56" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.4"/><text x="74" y="462" font-size="18" fill="#1f2328" text-anchor="start" font-weight="400">what this is not: long-context ability. Whatever left the window is gone — stable, not informed. "Does not crash" ≠ "can use".</text></g><text x="1220" y="20" font-size="17" fill="#6b7280" text-anchor="end" font-weight="400">schematic — not a measurement · n_sink and W: read §3 before quoting numbers</text></svg>