xt-anchor="start" font-weight="400">two sub-layers around</text><text x="618" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">W3's attention, pre-LN</text><line x1="894" y1="112" x2="915" y2="112" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-demo1-flow)"/><rect x="920" y="42" width="300" height="140" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="938" y="78" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">4 · GPT</text><text x="938" y="108" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">embedding, blocks, final</text><text x="938" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">Norm, tied</text><text x="938" y="168" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">unembedding</text><g class="fragment" data-fragment-index="1"><text x="20" y="226" font-size="23" fill="#b45309" text-anchor="start" font-weight="700">A test after each class; then the same program comes back twice</text><text x="950" y="226" font-size="19" fill="#6b7280" text-anchor="end" font-weight="400">tests.py</text><rect x="20" y="240" width="290" height="140" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="38" y="276" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">now: shapes</text><text x="38" y="306" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">a batch goes in,</text><svg x="38" y="315.3" width="96.048" height="27.6" viewBox="0 0 96.048 27.6"><defs>
