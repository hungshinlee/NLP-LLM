</svg><text x="853.072" y="167" font-size="23" fill="#15803d" text-anchor="start" font-weight="400" textLength="135.5" lengthAdjust="spacing">pairs cleanly</text><text x="20" y="232" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Second half — how it forgets, what it costs, who ships it</text><rect x="20" y="250" width="386.667" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="52" cy="285" r="18" fill="#b45309"/><text x="52" y="293" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="80" y="294" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Forgetting</text><text x="38" y="330" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">2023–2025: how does the</text><text x="38" y="359" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">notebook forget? SSMs, SSD</text><line x1="408.667" y1="311" x2="423.667" y2="311" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="426.667" y="250" width="386.667" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="458.667" cy="285" r="18" fill="#b45309"/><text x="458.667" y="293" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="486.667" y="294" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">The bill</text><text x="444.667" y="330" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">when is the notebook smaller,</text><text x="444.667" y="359" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">and what can it not pay?</text><line x1="815.333" y1="311" x2="830.333" y2="311" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="833.333" y="250" width="386.667" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="865.333" cy="285" r="18" fill="#b45309"/><text x="865.333" y="293" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="893.333" y="294" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">2026</text><text x="851.333" y="330" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">three routes, none has won:</text><text x="851.333" y="359" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">why does the table decide?</text></svg>