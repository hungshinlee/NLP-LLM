<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1180 470" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-ledger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="20" width="540" height="420" rx="11" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.8"/><rect x="620" y="20" width="540" height="420" rx="11" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.8"/><text x="44" y="62" font-size="28" fill="#0b5cad" text-anchor="start" font-weight="700">Training</text><text x="644" y="62" font-size="28" fill="#b45309" text-anchor="start" font-weight="700">Inference, per token</text><line x1="44" y1="78" x2="536" y2="78" stroke="#d1d5db" stroke-width="1.4"/><line x1="644" y1="78" x2="1136" y2="78" stroke="#d1d5db" stroke-width="1.4"/><text x="44" y="120" font-size="30" fill="#1f2328" text-anchor="start" font-weight="700">C  ≈  6 · N · D</text><text x="44" y="158" font-size="24" fill="#6b7280" text-anchor="start" font-weight="400">N  parameters</text><text x="44" y="190" font-size="24" fill="#6b7280" text-anchor="start" font-weight="400">D  training tokens</text><text x="44" y="222" font-size="24" fill="#6b7280" text-anchor="start" font-weight="400">6  = 2 forward + 4 backward</text><text x="44" y="282" font-size="25" fill="#1f2328" text-anchor="start" font-weight="400">optimizer state  ≈  2 · N   (Adam)</text><text x="44" y="330" font-size="25" fill="#1f2328" text-anchor="start" font-weight="400">MoE:  N_total sets memory,</text><text x="44" y="362" font-size="25" fill="#1f2328" text-anchor="start" font-weight="400">          N_active sets FLOPs</text><text x="644" y="120" font-size="28" fill="#1f2328" text-anchor="start" font-weight="700">prefill:   ≈ 2 · N · L_in</text><text x="644" y="152" font-size="22" fill="#15803d" text-anchor="start" font-weight="700">compute bound</text><text x="644" y="206" font-size="28" fill="#1f2328" text-anchor="start" font-weight="700">decode:  ≈ 2 · N</text><text x="644" y="238" font-size="22" fill="#dc2626" text-anchor="start" font-weight="700">memory bound</text><text x="644" y="292" font-size="25" fill="#1f2328" text-anchor="start" font-weight="400">KV cache =</text><text x="644" y="324" font-size="24" fill="#1f2328" text-anchor="start" font-weight="400">  2 · n_layer · n_kv_head · d_head</text><text x="644" y="354" font-size="24" fill="#1f2328" text-anchor="start" font-weight="400">      · L · bytes_per_elem</text><text x="644" y="402" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">the bound is moving N and the KV</text><text x="644" y="428" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">from HBM into SRAM, not the arithmetic</text><line x1="566" y1="230" x2="612" y2="230" stroke="#6b7280" stroke-width="2.4" marker-end="url(#ah-ledger)"/></svg>