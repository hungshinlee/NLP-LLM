<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 450" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="14" width="560" height="422" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="300" y="46" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="700">seq2seq, 2014: one fixed-width vector</text><rect x="47" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="90" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">1</tspan></text><rect x="147" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="190" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">2</tspan></text><line x1="133" y1="370" x2="147" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="247" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="290" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">3</tspan></text><line x1="233" y1="370" x2="247" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="347" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="390" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">4</tspan></text><line x1="333" y1="370" x2="347" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="447" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="490" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">5</tspan></text><line x1="433" y1="370" x2="447" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><text x="300" y="418" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="400">the encoder reads the whole source …</text><line x1="533" y1="370" x2="548" y2="370" stroke="#1f2328" stroke-width="2"/><line x1="548" y1="370" x2="548" y2="250" stroke="#1f2328" stroke-width="2"/><line x1="548" y1="250" x2="262" y2="250" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="228" width="200" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="160" y="258" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan font-style="italic">v</tspan><tspan >   fixed width</tspan></text><line x1="160" y1="228" x2="160" y2="154" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah)"/><rect x="117" y="108" width="86" height="44" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="160" y="138" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">s</tspan><tspan dy="6" font-size="15.4">1</tspan></text><rect x="237" y="108" width="86" height="44" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="280" y="138" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">s</tspan><tspan dy="6" font-size="15.4">2</tspan></text><line x1="203" y1="130" x2="237" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="357" y="108" width="86" height="44" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="400" y="138" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">s</tspan><tspan dy="6" font-size="15.4">3</tspan></text><line x1="323" y1="130" x2="357" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="477" y="108" width="86" height="44" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="520" y="138" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">s</tspan><tspan dy="6" font-size="15.4">4</tspan></text><line x1="443" y1="130" x2="477" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><text x="340" y="86" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="400">… and the decoder writes from that one vector</text><text x="290" y="306" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="700">5 words or 50: the same number of floats</text><rect x="620" y="14" width="600" height="422" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="920" y="46" font-size="20" fill="#15803d" text-anchor="middle" font-weight="700">Bahdanau, 2015: a fresh weighted read at every output step</text><rect x="657" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="700" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">1</tspan></text><rect x="757" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="800" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">2</tspan></text><line x1="743" y1="370" x2="757" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="857" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="900" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">3</tspan></text><line x1="843" y1="370" x2="857" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="957" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="1000" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">4</tspan></text><line x1="943" y1="370" x2="957" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><rect x="1057" y="348" width="86" height="44" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="1100" y="378" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">h</tspan><tspan dy="6" font-size="15.4">5</tspan></text><line x1="1043" y1="370" x2="1057" y2="370" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><text x="920" y="418" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="400">keys and values: all the encoder states, at every step</text><line x1="700" y1="348" x2="864" y2="272" stroke="#15803d" stroke-width="1.95"/><line x1="800" y1="348" x2="882" y2="272" stroke="#15803d" stroke-width="2.4"/><line x1="900" y1="348" x2="900" y2="272" stroke="#15803d" stroke-width="6.9"/><line x1="1000" y1="348" x2="918" y2="272" stroke="#15803d" stroke-width="3.3"/><line x1="1100" y1="348" x2="936" y2="272" stroke="#15803d" stroke-width="1.95"/><rect x="800" y="228" width="200" height="44" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.6"/><text x="900" y="258" font-size="22" fill="#15803d" text-anchor="middle" font-weight="700"><tspan font-style="italic">c</tspan><tspan font-style="italic" dy="6" font-size="15.4">t</tspan><tspan dy="-6"> = Σ</tspan><tspan font-style="italic" dy="6" font-size="15.4">i</tspan><tspan dy="-6"> α</tspan><tspan font-style="italic" dy="6" font-size="15.4">ti</tspan><tspan font-style="italic" dy="-6"> h</tspan><tspan font-style="italic" dy="6" font-size="15.4">i</tspan></text><text x="1012" y="258" font-size="17" fill="#6b7280" text-anchor="start" font-weight="400" font-style="italic">width ∝ α, illustrative</text><rect x="732" y="108" width="96" height="44" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="780" y="138" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">s</tspan><tspan dy="6" font-size="15.4">t−1</tspan></text><rect x="992" y="108" width="96" height="44" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="1040" y="138" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">s</tspan><tspan font-style="italic" dy="6" font-size="15.4">t</tspan></text><line x1="828" y1="130" x2="992" y2="130" stroke="#1f2328" stroke-width="2" marker-end="url(#ah)"/><line x1="920" y1="228" x2="1016" y2="154" stroke="#15803d" stroke-width="2.4" marker-end="url(#ah)"/><line x1="756" y1="154" x2="694" y2="344" stroke="#b45309" stroke-width="1.1" stroke-dasharray="4 4"/><line x1="756" y1="154" x2="794" y2="344" stroke="#b45309" stroke-width="1.1" stroke-dasharray="4 4"/><line x1="756" y1="154" x2="894" y2="344" stroke="#b45309" stroke-width="1.1" stroke-dasharray="4 4"/><line x1="756" y1="154" x2="994" y2="344" stroke="#b45309" stroke-width="1.1" stroke-dasharray="4 4"/><line x1="756" y1="154" x2="1094" y2="344" stroke="#b45309" stroke-width="1.1" stroke-dasharray="4 4"/><text x="660" y="86" font-size="19" fill="#b45309" text-anchor="start" font-weight="400"><tspan >query: the decoder state scores every h</tspan><tspan font-style="italic" dy="6" font-size="13.3">i</tspan><tspan dy="-6">; softmax gives α</tspan><tspan font-style="italic" dy="6" font-size="13.3">ti</tspan></text></svg>