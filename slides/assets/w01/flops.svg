<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="16" width="380" height="368" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="210" y="52" font-size="20" fill="#0b5cad" text-anchor="middle" font-weight="700">FORWARD: one token, one layer</text><rect x="48" y="118" width="64" height="64" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="80" y="160" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">x</tspan></text><line x1="112" y1="150" x2="168" y2="150" stroke="#1f2328" stroke-width="2.2" marker-end="url(#ah)"/><rect x="170" y="104" width="92" height="92" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="216" y="160" font-size="30" fill="#0b5cad" text-anchor="middle" font-weight="700"><tspan font-style="italic">W</tspan></text><line x1="262" y1="150" x2="318" y2="150" stroke="#1f2328" stroke-width="2.2" marker-end="url(#ah)"/><rect x="320" y="118" width="64" height="64" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.6"/><text x="352" y="160" font-size="26" fill="#1f2328" text-anchor="middle" font-weight="700"><tspan font-style="italic">y</tspan></text><text x="210" y="244" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="400"><tspan font-style="italic">y</tspan><tspan font-style="italic" dy="6" font-size="16.8">j</tspan><tspan dy="-6"> = Σ</tspan><tspan font-style="italic" dy="6" font-size="16.8">i</tspan><tspan font-style="italic" dy="-6"> W</tspan><tspan font-style="italic" dy="6" font-size="16.8">ji</tspan><tspan font-style="italic" dy="-6"> x</tspan><tspan font-style="italic" dy="6" font-size="16.8">i</tspan></text><text x="210" y="284" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan >every weight </tspan><tspan font-style="italic">W</tspan><tspan font-style="italic" dy="6" font-size="14.7">ji</tspan><tspan dy="-6">: one multiply, one add</tspan></text><circle cx="210" cy="340" r="26" fill="#0b5cad"/><text x="210" y="349" font-size="26" fill="#fff" text-anchor="middle" font-weight="700">2</text><rect x="420" y="16" width="400" height="368" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="620" y="52" font-size="20" fill="#b45309" text-anchor="middle" font-weight="700">BACKWARD: the same token</text><text x="620" y="132" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="400"><tspan font-style="italic">∂L/∂x</tspan><tspan font-style="italic"> = W</tspan><tspan >ᵀ</tspan><tspan font-style="italic"> ∂L/∂y</tspan></text><text x="620" y="162" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="400">gradient for the layer below · 2 per weight</text><text x="620" y="224" font-size="25" fill="#1f2328" text-anchor="middle" font-weight="400"><tspan font-style="italic">∂L/∂W</tspan><tspan font-style="italic"> = ∂L/∂y</tspan><tspan font-style="italic"> x</tspan><tspan >ᵀ</tspan></text><text x="620" y="254" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="400">gradient for the weights · 2 per weight</text><line x1="470" y1="190" x2="770" y2="190" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6 5"/><circle cx="620" cy="340" r="26" fill="#b45309"/><text x="620" y="349" font-size="26" fill="#fff" text-anchor="middle" font-weight="700">4</text><rect x="840" y="16" width="380" height="368" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="1030" y="52" font-size="20" fill="#15803d" text-anchor="middle" font-weight="700">PER PARAMETER, PER TOKEN</text><text x="1030" y="130" font-size="40" fill="#1f2328" text-anchor="middle" font-weight="700">2 + 4 = 6</text><text x="1030" y="176" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400"><tspan >× </tspan><tspan font-style="italic">N</tspan><tspan > parameters × </tspan><tspan font-style="italic">D</tspan><tspan > tokens</tspan></text><text x="1030" y="220" font-size="30" fill="#15803d" text-anchor="middle" font-weight="700"><tspan font-style="italic">C</tspan><tspan dy="6" font-size="21">train</tspan><tspan dy="-6"> ≈ 6</tspan><tspan font-style="italic">ND</tspan></text><line x1="880" y1="248" x2="1180" y2="248" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="6 5"/><text x="1030" y="286" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan >inference is forward only:  2</tspan><tspan font-style="italic">N</tspan><tspan > per token</tspan></text><text x="1030" y="320" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400"><tspan >Adam keeps </tspan><tspan font-style="italic">m</tspan><tspan >, </tspan><tspan font-style="italic">v</tspan><tspan > per weight:  2</tspan><tspan font-style="italic">N</tspan><tspan > values</tspan></text><text x="1030" y="356" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="400" font-style="italic">left out: attention scores, which grow with context</text></svg>