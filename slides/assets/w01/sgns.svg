width="2.6" marker-end="url(#ah)"/><text x="429" y="52" font-size="20" fill="#15803d" text-anchor="middle" font-weight="700"><tspan >pull together:  log σ(u</tspan><tspan font-style="italic" dy="6" font-size="14">o</tspan><tspan dy="-6">ᵀ v</tspan><tspan font-style="italic" dy="6" font-size="14">c</tspan><tspan dy="-6">)</tspan></text><rect x="760" y="48" width="440" height="170" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6" stroke-dasharray="7 5"/><text x="980" y="78" font-size="20" fill="#b45309" text-anchor="middle" font-weight="700"><tspan >K = 3 draws from P</tspan><tspan font-style="italic" dy="6" font-size="14">n</tspan><tspan dy="-6"> ∝ unigram</tspan><tspan dy="-9" font-size="14">3/4</tspan></text><rect x="774" y="102" width="128" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.6"/><text x="838" y="134" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700">anon</text><rect x="916" y="102" width="128" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.6"/><text x="980" y="134" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700">seldom</text><rect x="1058" y="102" width="128" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.6"/><text x="1122" y="134" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700">a</text><text x="980" y="190" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan >push apart:  Σ</tspan><tspan font-style="italic" dy="6" font-size="14">k</tspan><tspan dy="-6"> log σ(−u</tspan><tspan font-style="italic" dy="6" font-size="14">w</tspan><tspan dy="-6">ᵀ v</tspan><tspan font-style="italic" dy="6" font-size="14">c</tspan><tspan dy="-6">)</tspan></text><path d="M304,152 L304,212 L720,212 L720,143" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah)"/><line x1="720" y1="143" x2="758" y2="143" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ah)"/><text x="40" y="256" font-size="18" fill="#6b7280" text-