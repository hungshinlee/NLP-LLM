</svg><text x="616.334" y="134" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400" textLength="223.6" lengthAdjust="spacing">is forced by softmax:</text><text x="500" y="166" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">a head with nothing useful to read still has to put</text><text x="500" y="196" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">its mass somewhere, and every query can see token 1</text><text x="500" y="248" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">W5: evict token 1 from the cache and the model breaks;</text><text x="500" y="278" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">keep it, and a sliding window works: StreamingLLM</text></svg>