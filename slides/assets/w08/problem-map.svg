<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 452" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-problem-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="20" y="20" width="1200" height="58" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.4"/><text x="40" y="45" font-size="20" fill="#0b5cad" text-anchor="start" font-weight="700">1 · what does it learn?</text><text x="40" y="70" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">a template, a mask, an end token — and mostly a format and a sub-distribution, not facts</text><rect x="20" y="86" width="1200" height="58" rx="7" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.4"/><text x="40" y="111" font-size="20" fill="#0b5cad" text-anchor="start" font-weight="700">2 · how to train it where it does not fit?</text><text x="40" y="136" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">freeze the base, learn a narrow correction beside each matrix; then store the frozen copy in 4 bits</text><rect x="20" y="152" width="1200" height="58" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.4"/><text x="40" y="177" font-size="20" fill="#0b5cad" text-anchor="start" font-weight="700">3 · is the cheap one the same thing?</text><text x="40" y="202" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">look at the weights' spectrum; and before comparing scores, ask whether the learning rate was tuned</text><rect x="20" y="218" width="1200" height="58" rx="7" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.4"/><text x="40" y="243" font-size="20" fill="#0b5cad" text-anchor="start" font-weight="700">4 · what does it cost, and how to pay less?</text><text x="40" y="268" font-size="19" fill="#1f2328" text-anchor="start" font-weight="400">forgetting, measured with W1's ruler; and adding separately trained corrections together</text><g class="fragment" data-fragment-index="1"><rect x="20" y="290" width="1200" height="64" rx="9" fill="#fff" stroke="#d1d5db" stroke-width="1.4"/><text x="40" y="316" font-size="20" fill="#1f2328" text-anchor="start" font-weight="400">six parts: what SFT learns → the 16 bytes and a side road (LoRA) → 4 bits for the frozen copy (QLoRA) →</text><text x="40" y="342" font-size="20" fill="#1f2328" text-anchor="start" font-weight="400">is it the same model (the learning rate; the spectrum) → what it forgets, and how to measure it → adding the side roads up</text></g><g class="fragment" data-fragment-index="2"><rect x="20" y="372" width="1200" height="68" rx="9" fill="#fff5f5" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/><text x="40" y="400" font-size="19" fill="#dc2626" text-anchor="start" font-weight="700">one sentence for today: SFT teaches the format of an answer more than the facts in it; LoRA saves the optimizer's bytes,</text><text x="40" y="426" font-size="19" fill="#dc2626" text-anchor="start" font-weight="700">not the weights' — and a comparison of two methods at one learning rate compared nothing.</text></g></svg>