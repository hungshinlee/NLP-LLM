<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 388" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-half-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="40" font-size="27" fill="#0b5cad" text-anchor="start" font-weight="700">First half — what is learned, and on which machine?</text><text x="725.196" y="40" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">answered</text><rect x="20" y="58" width="386" height="122" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><circle cx="54" cy="93" r="18" fill="#15803d"/><text x="54" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">✓</text><text x="84" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">What SFT learns</text><text x="42" y="138" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">a format and a shelf —</text><text x="42" y="167" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">not new facts</text><line x1="408" y1="119" x2="424" y2="119" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="427" y="58" width="386" height="122" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><circle cx="461" cy="93" r="18" fill="#15803d"/><text x="461" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">✓</text><text x="491" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">A side road: LoRA</text><text x="449" y="138" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">14 of the 16 bytes; the weights</text><text x="449" y="167" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">and activations stay</text><line x1="815" y1="119" x2="831" y2="119" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="834" y="58" width="386" height="122" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><circle cx="868" cy="93" r="18" fill="#15803d"/><text x="868" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">✓</text><text x="898" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Four bits: QLoRA</text><text x="856" y="138" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">stored in 4 bits,</text><text x="856" y="167" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">still computed in bf16</text><text x="20" y="234" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Second half — what did the cheap run buy?</text><rect x="20" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="54" cy="287" r="18" fill="#b45309"/><text x="54" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="84" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">The same model?</text><text x="42" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">compare the scores fairly;</text><text x="42" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">then look at the weights</text><line x1="408" y1="313" x2="424" y2="313" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="427" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="461" cy="287" r="18" fill="#b45309"/><text x="461" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="491" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">What it forgot</text><text x="449" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">forgot what — and</text><text x="449" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">measured how?</text><line x1="815" y1="313" x2="831" y2="313" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="834" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="868" cy="287" r="18" fill="#b45309"/><text x="868" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="898" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Adding roads up</text><text x="856" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">one road per task: can</text><text x="856" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the roads be summed?</text></svg>