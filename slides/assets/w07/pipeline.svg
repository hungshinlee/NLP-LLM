"19" fill="#6b7280" text-anchor="middle" font-weight="400">the sieve</text><text x="446.667" y="124" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">GlotLID /</text><text x="446.667" y="148" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">fastText</text><line x1="528.667" y1="95" x2="536" y2="95" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah-pipeline)"/><rect x="540" y="36" width="160" height="138" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="620" y="66" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">quality filter</text><text x="620" y="94" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="400">settle + carbon</text><text x="620" y="124" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">rules, then a</text><text x="620" y="148" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">classifier</text><line x1="702" y1="95" x2="709.333" y2="95" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah-pipeline)"/><rect x="713.333" y="36" width="160" height="138" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="793.333" y="66" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">deduplication</text><text x="793.333" y="94" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="400">one bucket once</text><text x="793.333" y="124" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">MinHash / LSH</text><line x1="875.333" y1="95" x2="882.667" y2="95" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah-pipeline)"/><rect x="886.667" y="36" width="160" height="138" rx="7" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="966.667" y="66" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">decontamination</text><text x="966.667" y="94" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="400">the final test</text><text x="966.667" y="124" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">n-gram vs.</text><text x="966.667" y="148" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">test sets</text><line x1="1048.67" y1="95" x2="1056" y2="95" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah-pipeline)"/><rect x="1060" y="36" width="160" height="138" rx="7" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="1140" y="66" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">PII · mixing</text><text x="1140" y="94" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="400">bottling</text><text x="1140" y="124" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">weights, then</text><text x="1140" y="148" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="400">order</text><text x="20" y="204" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">each stage removes one kind of thing — the two highlighted stages are where today's demos 3 and 4 run</text><g class="fragment" data-fragment-index="1"><text x="20" y="232" font-size="19" fill="#dc2626" text-anchor="start" font-weight="700">fails when:</text><rect x="20" y="244" width="160" height="100" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><text x="100" y="272" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">the source is</text><text x="100" y="296" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">the web, as it</text><text x="100" y="320" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">is</text><rect x="193.333" y="244" width="160" height="100" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><text x="273.333" y="272" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">code and math</text><text x="273.333" y="296" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">formatting</text><text x="273.333" y="320" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">lost</text><rect x="366.667" y="244" width="160" height="100" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><text x="446.667" y="272" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">Han = one</text><text x="446.667" y="296" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">code; Hakka:</text><text x="446.667" y="320" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">74 pages</text><rect x="540" y="244" width="160" height="100" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><text x="620" y="272" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">'quality' is</text><text x="620" y="296" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">one judge's</text><text x="620" y="320" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">taste</text><rect x="713.333" y="244" width="160" height="100" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><text x="793.333" y="272" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">global dedup</text><text x="793.333" y="296" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">made FineWeb</text><text x="793.333" y="320" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">worse</text><rect x="886.667" y="244" width="160" height="100" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><text x="966.667" y="272" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">catches only</text><text x="966.667" y="296" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">what repeats</text><rect x="1060" y="244" width="160" height="100" rx="7" fill="#fff5f5" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/><text x="1140" y="272" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">small proxies</text><text x="1140" y="296" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">may not</text><text x="1140" y="320" font-size="19" fill="#dc2626" text-anchor="middle" font-weight="400">transfer</text></g><g class="fragment" data-fragment-index="2"><rect x="20" y="366" width="1200" height="70" rx="9" fill="#fff" stroke="#1f2328" stroke-width="1.4"/><text x="40" y="394" font-size="20" fill="#1f2328" text-anchor="start" font-weight="400">every stage also removes good water: Dodge's C4 audit, FineWeb's global deduplication, Nemotron-CC's 'filter less' —</text><text x="40" y="420" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">a filter is a parameter with a cost, not a virtue; and what the sieve (language ID) removes, no later stage recovers</text></g></svg>