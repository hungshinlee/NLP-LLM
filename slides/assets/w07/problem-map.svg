</svg><text x="472.583" y="40" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400" textLength="441.8" lengthAdjust="spacing">: how big a model, on how many tokens?</text><g class="fragment" data-fragment-index="1"><rect x="20" y="58" width="386" height="122" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><circle cx="54" cy="93" r="18" fill="#0b5cad"/><text x="54" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="84" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Derive it</text><text x="42" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">where does “20 tokens</text><text x="42" y="167" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">per parameter” come from?</text><line x1="408" y1="119" x2="424" y2="119" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="427" y="58" width="386" height="122" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><circle cx="461" cy="93" r="18" fill="#0b5cad"/><text x="461" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="491" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Add to the bill</text><text x="449" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">what does “train it once”</text><text x="449" y="167" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">leave out?</text><line x1="815" y1="119" x2="831" y2="119" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="834" y="58" width="386" height="122" rx="7" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.8"/><circle cx="868" cy="93" r="18" fill="#0b5cad"/><text x="868" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="898" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Check the method</text><text x="856" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">can a law fitted on small</text><text x="856" y="167" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">runs be trusted?</text></g><text x="20" y="234" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Second half — which tokens?</text><text x="430.322" y="234" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">compute buys a count of tokens; a pipeline picks them</text><g class="fragment" data-fragment-index="2"><rect x="20" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="54" cy="287" r="18" fill="#b45309"/><text x="54" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="84" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">The plant</text><text x="42" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">who turns the web into</text><text x="42" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">training text, and how?</text><line x1="408" y1="313" x2="424" y2="313" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="427" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="461" cy="287" r="18" fill="#b45309"/><text x="461" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="491" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Mix and order</text><text x="449" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">how much of each source,</text><text x="449" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">and in what order?</text><line x1="815" y1="313" x2="831" y2="313" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-problem-map)"/><rect x="834" y="252" width="386" height="122" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="868" cy="287" r="18" fill="#b45309"/><text x="868" y="295" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="898" y="296" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Make more?</text><text x="856" y="332" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">what if the good text</text><text x="856" y="361" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">runs out?</text></g></svg>