</svg><line x1="213" y1="106" x2="246" y2="106" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-loop)"/><rect x="250" y="46" width="270" height="120" rx="8" fill="#eef2ff" stroke="#0b5cad" stroke-width="1.6"/><text x="268" y="82" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the LLM reasons</text><text x="268" y="114" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">search, or</text><text x="268" y="144" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">answer now?</text><line x1="523" y1="106" x2="556" y2="106" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-loop)"/><rect x="560" y="46" width="230" height="120" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="578" y="82" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">a query</text><text x="578" y="114" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">written by</text><text x="578" y="144" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the model</text><line x1="793" y1="106" x2="826" y2="106" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-loop)"/><rect x="830" y="46" width="250" height="120" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="848" y="82" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the retriever</text><text x="848" y="114" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">passages are</text><text x="848" y="144" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">appended</text><path d="M 955 170 C 955 214, 385 214, 385 172" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ah-loop)"/><text x="670" y="226" font-size="23" fill="#6b7280" text-anchor="middle" font-weight="400">each turn: one prefill and some decoding (W11)</text><line x1="1084" y1="106" x2="1116" y2="106" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-loop)"/><text x="1124" y="100" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the</text><text x="1124" y="130" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">answer</text><text x="20" y="286" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Training — two roads</text><g class="fragment" data-fragment-index="1"><rect x="20" y="302" width="590" height="140" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="38" y="338" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">Self-RAG: supervised (W8)</text><text x="38" y="370" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">a critic labels the corpus offline: retrieve here?</text><text x="38" y="400" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">is this passage useful? is this sentence supported?</text><text x="38" y="430" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the labels become tokens, trained in by SFT</text></g><g class="fragment" data-fragment-index="2"><rect x="630" y="302" width="590" height="140" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="648" y="338" font-size="23" fill="#b45309" text-anchor="start" font-weight="700">Search-R1: reinforcement learning (W9)</text><text x="648" y="370" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">run the whole trajectory; reward only whether</text><text x="648" y="400" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the final answer is right; retrieved tokens are</text><text x="648" y="430" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">masked out of the loss</text></g></svg>