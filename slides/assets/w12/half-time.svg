<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 452" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-half-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="40" font-size="27" fill="#0b5cad" text-anchor="start" font-weight="700">First half — finding: which tokens deserve a place?</text><text x="707.185" y="40" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">answered</text><rect x="20" y="58" width="386" height="154" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><circle cx="54" cy="93" r="18" fill="#15803d"/><text x="54" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">✓</text><text x="84" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Why outside?</text><text x="40" y="140" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">weights cannot be updated,</text><text x="40" y="170" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">cited, or cover the long tail;</text><text x="40" y="200" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">it helps where memory is thin</text><line x1="408" y1="135" x2="424" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="427" y="58" width="386" height="154" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><circle cx="461" cy="93" r="18" fill="#15803d"/><text x="461" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">✓</text><text x="491" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Four scorers</text><text x="447" y="140" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">by when the two sides meet:</text><text x="447" y="170" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">on words, in one vector, per</text><text x="447" y="200" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">token, or read together</text><line x1="815" y1="135" x2="831" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="834" y="58" width="386" height="154" rx="7" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/><circle cx="868" cy="93" r="18" fill="#15803d"/><text x="868" y="101" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">✓</text><text x="898" y="102" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Similar to what?</text><text x="854" y="140" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">from pairs that co-occur in</text><text x="854" y="170" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">training (PMI); and one</text><text x="854" y="200" font-size="23" fill="#15803d" text-anchor="start" font-weight="400">vector's capacity is bounded</text><text x="20" y="266" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Second half — using: it was found. Then what?</text><rect x="20" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="54" cy="319" r="18" fill="#b45309"/><text x="54" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="84" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Which step?</text><text x="40" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the answer is</text><text x="40" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">wrong: which step</text><text x="40" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">failed?</text><line x1="306.25" y1="361" x2="322.25" y2="361" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="325.25" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="359.25" cy="319" r="18" fill="#b45309"/><text x="359.25" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="389.25" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Cited, so used?</text><text x="345.25" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">it cites a source.</text><text x="345.25" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">did it read the</text><text x="345.25" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">source?</text><line x1="611.5" y1="361" x2="627.5" y2="361" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="630.5" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="664.5" cy="319" r="18" fill="#b45309"/><text x="664.5" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="694.5" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">All of it?</text><text x="650.5" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">why not put</text><text x="650.5" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">everything into</text><text x="650.5" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the context?</text><line x1="916.75" y1="361" x2="932.75" y2="361" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="935.75" y="284" width="284.25" height="154" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="969.75" cy="319" r="18" fill="#b45309"/><text x="969.75" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">7</text><text x="999.75" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Who decides?</text><text x="955.75" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">can the model</text><text x="955.75" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">decide what to</text><text x="955.75" y="426" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">look up?</text></svg>