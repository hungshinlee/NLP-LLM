<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1240 400" width="100%" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,PingFang TC,Noto Sans TC,sans-serif"><defs><marker id="ah-budget" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><text x="20" y="30" font-size="27" fill="#0b5cad" text-anchor="start" font-weight="700">One window, one budget — everything in it was paid for</text><rect x="20" y="46" width="146" height="60" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="95" y="84" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">system</text><rect x="170" y="46" width="216" height="60" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="280" y="84" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">tool descriptions</text><rect x="390" y="46" width="186" height="60" rx="6" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/><text x="485" y="84" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">history</text><rect x="580" y="46" width="256" height="60" rx="6" fill="#fde9c8" stroke="#b45309" stroke-width="1.6"/><text x="710" y="84" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">retrieved passages</text><rect x="840" y="46" width="226" height="60" rx="6" fill="#eef2ff" stroke="#d1d5db" stroke-width="1.6"/><text x="955" y="84" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">its own reasoning</text><rect x="1070" y="46" width="146" height="60" rx="6" fill="#c7d7f5" stroke="#d1d5db" stroke-width="1.6"/><text x="1145" y="84" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">question</text><text x="20" y="140" font-size="23" fill="#6b7280" text-anchor="start" font-weight="400">retrieval is one line of this budget: which passages earn a place</text><g class="fragment" data-fragment-index="1"><text x="20" y="204" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Kept outside until needed</text><rect x="20" y="220" width="392" height="50" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="7 5"/><text x="216" y="253" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">the corpus and its index</text><rect x="426" y="220" width="392" height="50" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="7 5"/><text x="622" y="253" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">files and tool results</text><rect x="832" y="220" width="392" height="50" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="7 5"/><text x="1028" y="253" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">notes the model wrote</text></g><g class="fragment" data-fragment-index="2"><text x="20" y="322" font-size="27" fill="#b45309" text-anchor="start" font-weight="700">Maintained as the steps go by</text><rect x="20" y="338" width="392" height="50" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="216" y="371" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">compact the old turns</text><rect x="426" y="338" width="392" height="50" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="622" y="371" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">write notes outside the window</text><rect x="832" y="338" width="392" height="50" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/><text x="1028" y="371" font-size="23" fill="#1f2328" text-anchor="middle" font-weight="400">hand a subtask a clean window</text></g></svg>