24" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="54" cy="319" r="18" fill="#b45309"/><text x="54" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="84" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">A new ability?</text><text x="40" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">RL trained the reasoning model:</text><text x="40" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">did it add anything new?</text><line x1="408" y1="346" x2="424" y2="346" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="427" y="284" width="386" height="124" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="461" cy="319" r="18" fill="#b45309"/><text x="461" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="491" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Is it the process?</text><text x="447" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">is the written reasoning how</text><text x="447" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the model got its answer?</text><line x1="815" y1="346" x2="831" y2="346" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-half-time)"/><rect x="834" y="284" width="386" height="124" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><circle cx="868" cy="319" r="18" fill="#b45309"/><text x="868" y="327" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">7</text><text x="898" y="328" font-size="27" fill="#1f2328" text-anchor="start" font-weight="700">Can we watch it?</text><text x="854" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">is it enough to monitor a</text><text x="854" y="396" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">model by — and will it last?</text></svg>