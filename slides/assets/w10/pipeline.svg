23" fill="#1f2328" text-anchor="start" font-weight="400">answer</text><g class="fragment" data-fragment-index="1"><rect x="20" y="262" width="590" height="126" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="38" y="300" font-size="23" fill="#6b7280" text-anchor="start" font-weight="700">last week (W9 p15)</text><text x="38" y="336" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">the examiner is there in training,</text><text x="38" y="368" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">and gone at inference</text><rect x="630" y="262" width="590" height="126" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><text x="648" y="300" font-size="23" fill="#b45309" text-anchor="start" font-weight="700">this week</text><text x="648" y="336" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">generator and examiner are both in memory</text><text x="648" y="368" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">at answer time — every answer pays for both</text></g></svg>