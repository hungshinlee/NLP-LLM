400">which falls first: ?</text><text x="998" y="138" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">dots follow</text><text x="998" y="168" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">which: ?</text><g class="fragment" data-fragment-index="1"><text x="20" y="226" font-size="23" fill="#b45309" text-anchor="start" font-weight="700">(b) later today: the thinking budget</text><text x="950" y="226" font-size="19" fill="#6b7280" text-anchor="end" font-weight="400">replay</text><rect x="20" y="240" width="440" height="140" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="38" y="276" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the same reasoning</text><text x="38" y="306" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">cut short at a budget, or pushed on</text><text x="38" y="336" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">with Wait</text><line x1="464" y1="310" x2="495" y2="310" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-demo1-flow)"/><rect x="500" y="240" width="450" height="140" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.6"/><text x="518" y="276" font-size="23" fill="#1f2328" text-anchor="start" font-weight="700">the answer, again</text><text x="518" y="306" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">accuracy at each budget, for an easy</text><text x="518" y="336" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">and a medium level</text><line x1="954" y1="310" x2="975" y2="310" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-demo1-flow)"/><rect x="980" y="240" width="240" height="140" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/><text x="998" y="276" font-size="23" fill="#dc2626" text-anchor="start" font-weight="700">the two curves</text><text x="998" y="306" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">where each stops</text><text x="998" y="336" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">rising: ?</text><text x="998" y="366" font-size="23" fill="#1f2328" text-anchor="start" font-weight="400">does either fall: ?</text></g></svg>